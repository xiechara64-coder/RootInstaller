# 每次 push / PR 都构建一次，并跑全部离线用例。
#
# 只做「能编译 + 用例全过」这两件事，不需要任何密钥：
# 构建用的是 build.ps1 自动生成的 debug.keystore。
# 正式发布的签名与 Release 见 release.yml。
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + offline tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          platform: '19'
          build-tools: '34.0.0'

      - name: Build APK
        shell: pwsh
        # build.ps1 在缺少 debug.keystore 时会自动生成一个，所以干净 checkout 也能构建
        run: ./build.ps1 -Platform 19 -BuildTools 34.0.0

      - name: Generate signature test samples
        shell: pwsh
        # 签名样本 APK 是生成的，不入库（.gitignore 排除 *.apk），所以 CI 里现场造
        run: ./tests/make-signed-samples.ps1 -BuildTools 34.0.0

      - name: Run offline tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootInstaller-debug
          path: RootInstaller.apk
          if-no-files-found: error
          retention-days: 14
