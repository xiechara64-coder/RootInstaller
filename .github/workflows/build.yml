# 每次 push / PR 都构建一次，并跑全部离线用例。
#
# 只做「能编译 + 用例全过」这两件事，不需要任何密钥：
# 构建用的是 build.ps1 自动生成的 debug.keystore。
# 正式发布的签名与 Release 见 release.yml。
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + offline tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          platform: '19'
          build-tools: '34.0.0'

      - name: Build APK
        shell: pwsh
        # build.ps1 在缺少 debug.keystore 时会自动生成一个，所以干净 checkout 也能构建
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          Write-Host "PWD           = $(Get-Location)"
          Write-Host "PSVersion     = $($PSVersionTable.PSVersion)"
          Write-Host "JAVA_HOME     = $env:JAVA_HOME"
          Write-Host "ANDROID_HOME  = $env:ANDROID_HOME"
          Write-Host "SDK_ROOT      = $env:ANDROID_SDK_ROOT"
          $j = Get-Command javac -ErrorAction SilentlyContinue
          if ($j) { Write-Host "javac         = $($j.Source)" }
          & javac -version 2>&1 | ForEach-Object { Write-Host "javac -version: $_" }

          & ./build.ps1 -Platform 19 -BuildTools 34.0.0 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            # 把日志尾部转成一条 ::error:: 注解。
            # 目的是让失败原因出现在 check-run 注解里，便于远程排查
            # （作业日志本身需要仓库写权限才能通过 API 下载）。
            $tail = ""
            if (Test-Path $log) {
              $tail = (Get-Content $log -Tail 30) -join "`n"
            }
            $tail = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error::build.ps1 退出码 $code。日志尾部：$tail"
            exit $code
          }
          Write-Host "构建成功"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate signature test samples
        shell: pwsh
        # 签名样本 APK 是生成的，不入库（.gitignore 排除 *.apk），所以 CI 里现场造
        run: ./tests/make-signed-samples.ps1 -BuildTools 34.0.0

      - name: Run offline tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootInstaller-debug
          path: RootInstaller.apk
          if-no-files-found: error
          retention-days: 14
