# 打 tag（v*）时用**发布密钥**签名，并把 APK 挂到 GitHub Release。
#
# 需要先在仓库 Settings -> Secrets and variables -> Actions 里配置：
#   RELEASE_KEYSTORE_BASE64    发布密钥库（release.keystore）的 base64，**一行**
#   RELEASE_KEYSTORE_PASSWORD  密钥库密码
#   RELEASE_KEY_ALIAS          密钥别名（如 release）
#   RELEASE_KEY_PASSWORD       私钥密码（与库密码相同时可留空）
#
# 生成 base64（Windows PowerShell）：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("D:\keys\release.keystore"))
#
# 为什么密钥要放 secret 而不是仓库：拿到密钥的人可以签出「和你的 App 同签名」
# 的更新包，系统会直接覆盖安装 —— 这等于把发布权交出去。
# 本 workflow 会把密钥解码到 $RUNNER_TEMP，作业结束即销毁，不写入工作区。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if (-not $tag) { throw "无法确定 tag" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "发布版本: $tag"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          platform: '19'
          build-tools: '34.0.0'

      - name: Decode release keystore
        id: keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            throw "缺少 secret RELEASE_KEYSTORE_BASE64。见本 workflow 顶部注释。"
          }
          $path = Join-Path $env:RUNNER_TEMP 'release.keystore'
          [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64.Trim()))
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "已把发布密钥写到 $path（作业结束即销毁）"

      - name: Build release APK
        shell: pwsh
        env:
          # build.ps1 会读这两个环境变量，避免密码出现在命令行里
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          $out = "RootInstaller-${{ steps.meta.outputs.tag }}.apk"
          $psArgs = @(
            '-Release',
            '-Platform', '19',
            '-BuildTools', '34.0.0',
            '-Keystore', "${{ steps.keystore.outputs.path }}",
            '-OutApk', $out
          )
          $alias = "${{ secrets.RELEASE_KEY_ALIAS }}"
          if ($alias) { $psArgs += @('-KsAlias', $alias) }
          ./build.ps1 @psArgs

      - name: Verify release APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = "RootInstaller-${{ steps.meta.outputs.tag }}.apk"
          if (-not (Test-Path $apk)) { throw "找不到产物 $apk" }

          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $bt = Join-Path $sdk 'build-tools\34.0.0'

          # 1) 必须是 v1+v2+v3（v1 供 Android 4.x，v2 覆盖 7.0-8.1，v3 覆盖 9+）
          $log = Join-Path $env:RUNNER_TEMP 'verify.log'
          & cmd.exe /c "`"$bt\apksigner.bat`" verify --verbose `"$apk`" > `"$log`" 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "apksigner verify 失败" }
          $text = Get-Content $log -Raw

          # apksigner 的原文形如：Verified using v1 scheme (JAR signing): true
          $checks = @(
            @{ Name = 'v1'; Pattern = 'Verified using v1 scheme \(JAR signing\):\s*true' },
            @{ Name = 'v2'; Pattern = 'Verified using v2 scheme \(APK Signature Scheme v2\):\s*true' },
            @{ Name = 'v3'; Pattern = 'Verified using v3 scheme \(APK Signature Scheme v3\):\s*true' }
          )
          foreach ($c in $checks) {
            if ($text -notmatch $c.Pattern) { throw "签名校验失败：缺少 $($c.Name) 签名" }
          }

          # 2) 发布包不能留 debuggable=true
          $dump = Join-Path $env:RUNNER_TEMP 'manifest.xml'
          & cmd.exe /c "`"$bt\aapt.exe`" dump xmltree `"$apk`" AndroidManifest.xml > `"$dump`" 2>&1"
          $manifest = Get-Content $dump -Raw
          if ($manifest -match 'debuggable.*0xffffffff') {
            throw "发布包仍是 android:debuggable=true"
          }
          Write-Host "签名方案 v1/v2/v3 全部通过，debuggable=false ✓"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootInstaller-${{ steps.meta.outputs.tag }}
          path: RootInstaller-${{ steps.meta.outputs.tag }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.meta.outputs.tag }}"
          $apk = "RootInstaller-$tag.apk"

          # 已存在就先删附件再补（支持同一个 tag 重跑）
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，改为上传/覆盖附件"
            & gh release upload $tag $apk --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败" }
          } else {
            & gh release create $tag $apk --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败" }
          }
          Write-Host "Done: https://github.com/${{ github.repository }}/releases/tag/$tag"
