name: 缺陷报告
description: 界面显示不对、安装失败、崩溃等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！**请先看一遍 README 的「排错」一节**，很多现象那里已经记录过了。

        另外，这个应用需要一个**已 root** 的设备。如果只是没 root 导致装不上，
        那不是 bug（见 README 的「已知限制」）。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你期望发生什么？实际发生了什么？
      placeholder: 我点「安装」后…… 期望…… 实际……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量写清楚从哪一步开始、点了什么
      placeholder: |
        1. 打开 RootInstaller
        2. 点某个包进入详情页
        3. 点「安装」
        4. ……
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: RootInstaller 版本
      description: 从 Releases 页面看到的 tag，例如 v1.0.0
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型 + Android 版本（设置 → 关于手机）。例如「华为 C8816D / Android 4.3」
      placeholder: 华为 C8816D / Android 4.3
    validations:
      required: true

  - type: input
    id: root
    attributes:
      label: root 方式
      description: SuperSU / Magisk / 系统自带 / 其它；版本号也写上
      placeholder: SuperSU 2.82
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选但很有用）
      description: |
        崩溃日志在应用私有目录 `files/crash/last-crash.txt`。
        设备已 root 的话可以直接取：
        `adb shell su -c "cat /data/data/com.dsh.rootinstaller/files/crash/last-crash.txt"`
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认设备已 root，且这不是 README「已知限制」里写过的行为
          required: true
        - label: 我已经搜过已有的 issue，没有重复
          required: true
